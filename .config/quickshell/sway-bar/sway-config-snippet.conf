# === Añade esto a ~/.config/sway/config ===
#
# NOTA: estos comandos asumen que instalaste esta carpeta en una
# subcarpeta CON NOMBRE dentro de ~/.config/quickshell/, es decir que
# ~/.config/quickshell/sway-bar/shell.qml existe (no directo en
# ~/.config/quickshell/shell.qml). Por eso todos los comandos usan
# "-c sway-bar" -- así podés tener las 3 variantes (niri-bar, sway-bar,
# hyprland-bar) instaladas al mismo tiempo sin que se pisen.
# "qs" es el binario de quickshell (alias corto habitual -- si en tu
# sistema el binario se llama "quickshell" en vez de "qs", cambialo en
# todas las líneas de abajo).

# 1) Elimina o comenta el bloque "bar { ... }" por defecto de sway,
#    ya que quickshell reemplaza a swaybar por completo.
# bar {
#     swaybar_command swaybar
# }

# 2) Lanza quickshell al iniciar sway
exec_always pkill -f "qs -c sway-bar"; exec qs -c sway-bar

# NOTA sobre los comentarios "# @category" / "# @title" de abajo: son
# opcionales, y los lee el visor de atajos (botón ⌨ / $mod+alt+k) para
# mostrar SOLO los binds anotados así, agrupados por categoría. Si no
# anotas nada, el visor muestra automáticamente todos los binds de todas
# formas — así que puedes ir anotando de a poco, a tu ritmo.

# @category Quickshell

# @title Abrir/cerrar launcher
bindsym $mod+alt+d exec qs -c sway-bar ipc call launcher toggle
# @title Abrir/cerrar menú de energía
bindsym $mod+shift+x exec qs -c sway-bar ipc call powermenu toggle
# @title Abrir/cerrar selector de fondo de pantalla
bindsym $mod+alt+w exec qs -c sway-bar ipc call wallpaper toggle
# @title Abrir/cerrar esta lista de atajos
bindsym $mod+alt+k exec qs -c sway-bar ipc call keybinds toggle
# @title Abrir/cerrar dock de accesos rápidos (Keybinds/Ajustes/Wallpaper)
bindsym $mod+alt+c exec qs -c sway-bar ipc call config-dock toggle
# @title Listado de ventanas abiertas (como "rofi -show window")
bindsym $mod+alt+Tab exec qs -c sway-bar ipc call windowlist toggle
# @title Abrir/cerrar Ajustes de la barra
# Respaldo por si ocultás los módulos "Ajustes" y "Config" de la barra:
# este atajo (y el comando `qs -c sway-bar ipc call bar-config toggle`)
# siempre funcionan, estén o no visibles esos botones.
bindsym $mod+alt+comma exec qs -c sway-bar ipc call bar-config toggle
# @title Prender/apagar auto-ocultado de la barra
bindsym $mod+alt+b exec qs -c sway-bar ipc call autohide toggle

# @category Multimedia

# @title Subir volumen
bindsym XF86AudioRaiseVolume  exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
# @title Bajar volumen
bindsym XF86AudioLowerVolume  exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# @title Silenciar/activar audio
bindsym XF86AudioMute         exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# @title Silenciar/activar micrófono
bindsym XF86AudioMicMute      exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# 5) (Opcional) Brillo, si tienes un portátil con light o brightnessctl instalado
# bindsym XF86MonBrightnessUp   exec brightnessctl set +5%
# bindsym XF86MonBrightnessDown exec brightnessctl set 5%-
