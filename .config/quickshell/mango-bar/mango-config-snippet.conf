# ============================================================================
# Claudito Shell -- snippet para ~/.config/mango/config.conf
#
# Pegá esto DENTRO de tu config.conf existente (no lo reemplaza). Los
# targets/métodos de IPC de acá abajo están confirmados leyendo los
# IpcHandler{} de shell.qml -- son los mismos 8 accesos (Super+Alt+letra)
# que ya usás en hyprland-bar/niri-bar/sway-bar, así que el atajo de
# teclado es el mismo sin importar en qué compositor estés.
#
# Requiere el binario "qs" (Quickshell) en el PATH.
# ============================================================================

# --- Arranque automático ---
# Usá esta línea EN VEZ de "exec-once = qs -c mango-bar" a secas, para que
# detecte el tema de íconos GTK igual que en las otras 3 variantes.
exec-once = sh ~/.config/quickshell/mango-bar/launch-with-icon-theme.sh

# --- Accesos de Claudito Shell (mismo esquema Super+Alt+X que las otras 3 variantes) ---
bind=SUPER+ALT,D,spawn,qs -c mango-bar ipc call launcher toggle
bind=SUPER+SHIFT,X,spawn,qs -c mango-bar ipc call powermenu toggle
bind=SUPER+ALT,W,spawn,qs -c mango-bar ipc call wallpaper toggle
bind=SUPER+ALT,K,spawn,qs -c mango-bar ipc call keybinds toggle
bind=SUPER+ALT,Tab,spawn,qs -c mango-bar ipc call windowlist toggle
bind=SUPER+ALT,comma,spawn,qs -c mango-bar ipc call bar-config toggle
bind=SUPER+ALT,B,spawn,qs -c mango-bar ipc call autohide toggle
bind=SUPER+ALT,C,spawn,qs -c mango-bar ipc call config-dock toggle

# --- Tags / multiview ---
# mango YA trae por defecto (ver wiki "quick-start"):
#   bind=CTRL,1..9,view,N          -> ver SOLO el tag N
#   bind=ALT,1..9,tag,N            -> mover la ventana enfocada al tag N
# Si tu config.conf (copiado de /etc/mango/config.conf) ya los tiene, NO
# los repitas acá -- "bind" no valida colisiones a menos que uses el flag
# "c". Lo único que falta agregar es el multiview por teclado (el bar ya
# lo tiene por click derecho en cada tag):
bind=CTRL+SHIFT,1,toggleview,1
bind=CTRL+SHIFT,2,toggleview,2
bind=CTRL+SHIFT,3,toggleview,3
bind=CTRL+SHIFT,4,toggleview,4
bind=CTRL+SHIFT,5,toggleview,5
bind=CTRL+SHIFT,6,toggleview,6
bind=CTRL+SHIFT,7,toggleview,7
bind=CTRL+SHIFT,8,toggleview,8
bind=CTRL+SHIFT,9,toggleview,9

# --- Opcional: ocultar la barra antes de capturas de pantalla ---
# (mismo patrón que "panic closeAll" en hyprland-bar/niri-bar/sway-bar)
# bind=SUPER,Print,spawn,sh -c "qs -c mango-bar ipc call panic closeAll; sleep 0.05; TU_HERRAMIENTA_DE_CAPTURA"
