# --- Reglas para ventanas flotantes y diálogos ---
 
# Diálogos emergentes genéricos (XWayland / GTK / Qt)
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="Preferences"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="utility"] floating enable
for_window [window_type="toolbar"] floating enable
for_window [window_type="splash"] floating enable
for_window [window_type="menu"] floating enable
 
# Diálogos de selección / guardado de archivos (Portal / GTK / Qt)
for_window [title="^(Open|Save|Select|Choose).*"] floating enable
for_window [title=".*File Upload.*"] floating enable
for_window [title=".*File Chooser.*"] floating enable
for_window [title="^Abrir.*"] floating enable
for_window [title="^Guardar.*"] floating enable
for_window [title="^Renombrar.*"] floating enable
for_window [title="^Progreso.*"] floating enable
 
# Forzar que la ventana flotante aparezca centrada y enfocada
for_window [floating] move position center
